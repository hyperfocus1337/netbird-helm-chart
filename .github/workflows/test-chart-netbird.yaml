name: Test netbird Chart

on:
  push:
  pull_request:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Verify Helm installation
        run: helm version

      - name: Lint Helm chart
        run: |
          helm lint ./charts/netbird --set domain=netbird.example.com

      - name: Render every example
        run: |
          for f in ./charts/netbird/examples/*/values.yaml; do
            echo "== $f"
            helm template netbird ./charts/netbird -f "$f" >/dev/null
          done

      - name: Install Helm chart for project
        # kind has no default LoadBalancer, so expose STUN as a NodePort instead.
        # store.encryptionKey has to base64-decode to an AES key of 16, 24 or 32 bytes,
        # or the server exits before it ever serves /health. Generate it rather than
        # hardcoding one that silently drifts out of spec.
        # Geolite is downloaded at startup by default; skip it so the test does not
        # depend on an external mirror.
        run: |
          helm install test-chart ./charts/netbird \
            --create-namespace --namespace netbird \
            --wait --timeout 10m \
            --set domain=netbird.example.com \
            --set server.config.authSecret=test-relay-secret \
            --set-string server.config.store.encryptionKey="$(openssl rand -base64 32)" \
            --set server.config.disableGeoliteUpdate=true \
            --set server.stun.service.type=NodePort \
            --set ingress.enabled=true

      - name: Check Helm release status
        run: |
          helm status test-chart --namespace netbird
          kubectl -n netbird get pods,svc,ingress

      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl -n netbird describe pods
          kubectl -n netbird logs -l app.kubernetes.io/component=server --tail=200 || true
          kubectl -n netbird logs -l app.kubernetes.io/component=dashboard --tail=50 || true
