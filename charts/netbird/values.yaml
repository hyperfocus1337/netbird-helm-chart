## @section Global
##
global:
  ## @param global.namespace Override the namespace the chart's objects are created in.
  ##
  namespace: ""

## @param nameOverride Override the chart name used in object names and labels.
##
nameOverride: ""

## @param fullnameOverride Override the fully qualified object name prefix.
##
fullnameOverride: ""

## @param domain Public hostname the whole deployment is served on, e.g. netbird.example.com.
## Required. Everything that needs the hostname (config, dashboard, ingress) defaults to it.
##
domain: ""

## @section NetBird server
## One container running management, signal, relay, STUN and the embedded IdP.
##
server:
  image:
    ## @param server.image.repository Server image repository.
    ##
    repository: netbirdio/netbird-server
    ## @param server.image.tag Server image tag. Defaults to the chart's appVersion.
    ##
    tag: ""
    ## @param server.image.pullPolicy Server image pull policy.
    ##
    pullPolicy: IfNotPresent

  ## @param server.imagePullSecrets Image pull secrets for the server image.
  ##
  imagePullSecrets: []

  ## @param server.replicaCount Server replicas. Keep at 1 unless you run an external store, signal
  ## and relay: the sqlite store and the embedded relay do not support multiple replicas.
  ##
  replicaCount: 1

  ## Ports used by the Kubernetes objects (container ports, Services, probes). They have to match
  ## config.listenAddress / config.stunPorts / config.metricsPort / config.healthcheckAddress, which
  ## is what these defaults do.
  ports:
    ## @param server.ports.http Port serving the API, the IdP, gRPC and the relay websocket.
    ##
    http: 80
    ## @param server.ports.stun UDP port of the embedded STUN server.
    ##
    stun: 3478
    ## @param server.ports.metrics Prometheus metrics port.
    ##
    metrics: 9090
    ## @param server.ports.health Healthcheck port, serving GET /health.
    ##
    health: 9000

  ## The server's config.yaml. Keys are passed through verbatim under `server:`, so anything
  ## upstream documents is settable here even when this chart does not name it:
  ## https://docs.netbird.io/selfhosted/maintenance/configuration-files
  ##
  ## The chart fills in the domain-derived values (exposedAddress, auth.issuer,
  ## auth.dashboardRedirectURIs) when they are left empty.
  ##
  ## The rendered file lands in a Secret, not a ConfigMap: it holds authSecret,
  ## store.encryptionKey and any DSN passwords. The server reads the file as plain YAML with no
  ## environment substitution, so those secrets have to sit inside it. To keep them out of your
  ## values, render the file yourself and point config.existingSecret at it.
  config:
    ## @param server.config.create Render config.yaml from the keys below into a Secret.
    ##
    create: true
    ## @param server.config.existingSecret Name of a Secret holding a ready-made config.yaml. Set
    ## this together with config.create=false to keep secrets out of your values.
    ##
    existingSecret: ""
    ## @param server.config.existingSecretKey Key inside that Secret.
    ##
    existingSecretKey: config.yaml

    ## @param server.config.listenAddress Address the HTTP/gRPC server binds to.
    ##
    listenAddress: ":80"
    ## @param server.config.exposedAddress Public URL handed to peers. Defaults to https://{domain}:443.
    ##
    exposedAddress: ""
    ## @param server.config.stunPorts UDP ports of the embedded STUN server.
    ##
    stunPorts:
      - 3478
    ## @param server.config.metricsPort Prometheus metrics port.
    ##
    metricsPort: 9090
    ## @param server.config.healthcheckAddress Healthcheck listen address.
    ##
    healthcheckAddress: ":9000"
    ## @param server.config.logLevel Log level: panic, fatal, error, warn, info, debug, trace.
    ##
    logLevel: info
    ## @param server.config.logFile "console" or a path inside the container.
    ##
    logFile: console
    ## @param server.config.dataDir Data directory; the persistent volume is mounted here.
    ##
    dataDir: /var/lib/netbird
    ## @param server.config.authSecret Shared secret for relay authentication. Required unless an
    ## external relay is configured. Generate with `openssl rand -base64 32`.
    ##
    authSecret: ""
    ## @param server.config.disableAnonymousMetrics Stop sending anonymous usage metrics upstream.
    ##
    disableAnonymousMetrics: false

    auth:
      ## @param server.config.auth.issuer OIDC issuer. Defaults to https://{domain}/oauth2, the
      ## embedded IdP. Point it at an external provider to use that instead.
      ##
      issuer: ""
      ## @param server.config.auth.localAuthDisabled Turn off the embedded IdP. Doing so invalidates
      ## every local user account, so only set it with an external provider configured.
      ##
      localAuthDisabled: false
      ## @param server.config.auth.signKeyRefreshEnabled Refresh the IdP signing keys automatically.
      ##
      signKeyRefreshEnabled: true
      ## @param server.config.auth.dashboardRedirectURIs Allowed dashboard redirect URIs. Defaults to
      ## https://{domain}/nb-auth and https://{domain}/nb-silent-auth.
      ##
      dashboardRedirectURIs: []
      ## @param server.config.auth.cliRedirectURIs Allowed redirect URIs for `netbird up`.
      ##
      cliRedirectURIs:
        - "http://localhost:53000/"
      ## Optional initial owner account, created on first start. Left empty, the first visit to the
      ## dashboard's /setup wizard claims ownership instead.
      owner:
        ## @param server.config.auth.owner.email Initial owner email.
        ##
        email: ""
        ## @param server.config.auth.owner.password Initial owner password, at least 8 characters.
        ##
        password: ""

    ## @param server.config.reverseProxy.trustedHTTPProxies CIDRs of the proxies in front of the
    ## server, so client IPs come from X-Forwarded-For. For an in-cluster ingress controller that is
    ## the pod CIDR, e.g. ["10.42.0.0/16"] on k3s.
    ## @param server.config.reverseProxy.trustedPeers CIDRs of trusted peer networks.
    ##
    reverseProxy:
      trustedHTTPProxies: []
      trustedPeers: []

    store:
      ## @param server.config.store.engine Management store: sqlite, postgres or mysql.
      ##
      engine: sqlite
      ## @param server.config.store.dsn Connection string for postgres/mysql.
      ##
      dsn: ""
      ## @param server.config.store.encryptionKey Encrypts sensitive rows, local users included.
      ## Generate with `openssl rand -base64 32` and back it up: losing it makes that data
      ## unrecoverable.
      ##
      encryptionKey: ""

    ## @param server.config.extra Extra keys merged into the `server:` block verbatim. Use it for
    ## anything this chart does not name: activityStore, authStore, stuns, relays, signalUri, tls,
    ## mfaSession* and so on.
    ## e.g:
    ## extra:
    ##   signalUri: "https://signal.example.com:443"
    ##   relays:
    ##     addresses: ["rels://relay.example.com:443"]
    ##     secret: "shared-secret"
    ##
    extra: {}

  service:
    ## @param server.service.type Service type for the HTTP/gRPC service.
    ##
    type: ClusterIP
    ## @param server.service.port Port of the HTTP/gRPC service.
    ##
    port: 80
    ## @param server.service.annotations Annotations for the HTTP/gRPC service.
    ##
    annotations: {}

  ## Second Service over the same pods, for the gRPC routes only: gRPC needs HTTP/2 to the backend,
  ## and websockets (the relay) do not survive an h2c backend.
  serviceH2c:
    ## @param server.serviceH2c.enabled Create the h2c Service.
    ##
    enabled: true
    ## @param server.serviceH2c.annotations Annotations telling the ingress controller to speak h2c.
    ## Traefik uses the default below; ingress-nginx wants
    ## `nginx.ingress.kubernetes.io/backend-protocol: GRPC` on the Ingress instead.
    ##
    annotations:
      traefik.ingress.kubernetes.io/service.serversscheme: h2c

  ## The embedded STUN server cannot go through the ingress: it is UDP, and it answers with the
  ## source address it sees, so that address has to be the peer's real one.
  stun:
    ## @param server.stun.enabled Run the embedded STUN server and open its container port.
    ##
    enabled: true
    ## @param server.stun.hostPort Bind the STUN port directly on the node, e.g. 3478. Use this
    ## instead of a Service on any load balancer that masquerades: k3s's ServiceLB does, including
    ## with externalTrafficPolicy Local, in which case STUN hands every peer the load balancer's own
    ## address and is useless. hostPort keeps the peer's address intact, which is also what the
    ## upstream compose deployment gets from publishing the port on the host.
    ##
    hostPort: null
    ## @param server.stun.service.enabled Create a Service for the STUN port.
    ## @param server.stun.service.type LoadBalancer or NodePort.
    ## @param server.stun.service.port UDP port to expose.
    ## @param server.stun.service.nodePort Fixed node port, when type is NodePort.
    ## @param server.stun.service.externalTrafficPolicy Local avoids a second hop and keeps source
    ## addresses, but only on load balancers that preserve them in the first place.
    ## @param server.stun.service.annotations Annotations for the STUN service.
    ##
    service:
      enabled: true
      type: LoadBalancer
      port: 3478
      nodePort: null
      externalTrafficPolicy: Local
      annotations: {}

  persistence:
    ## @param server.persistence.enabled Persist the data directory. Off means losing every peer,
    ## user and key on restart.
    ##
    enabled: true
    ## @param server.persistence.existingClaim Use an existing PVC instead of creating one.
    ##
    existingClaim: ""
    ## @param server.persistence.accessModes Access modes for the created PVC.
    ##
    accessModes:
      - ReadWriteOnce
    ## @param server.persistence.size Size of the created PVC. Holds store.db, events.db, idp.db and
    ## the GeoLite databases.
    ##
    size: 2Gi
    ## @param server.persistence.storageClass StorageClass for the created PVC. Empty uses the
    ## cluster default.
    ##
    storageClass: ""

  serviceAccount:
    ## @param server.serviceAccount.create Create a ServiceAccount for the server.
    ##
    create: true
    ## @param server.serviceAccount.name Name of the ServiceAccount to create or use.
    ##
    name: ""
    ## @param server.serviceAccount.annotations Annotations for the ServiceAccount.
    ##
    annotations: {}

  ## @param server.env Extra environment variables for the server container, as a map. Runtime
  ## overrides use the NB_ prefix, e.g. NB_LOG_LEVEL.
  ##
  env: {}

  ## @param server.envRaw Extra environment variables in raw Kubernetes form, for valueFrom.
  ##
  envRaw: []

  ## @param server.podAnnotations Annotations for the server pod.
  ## @param server.podLabels Extra labels for the server pod.
  ## @param server.podSecurityContext Pod security context for the server.
  ## @param server.securityContext Container security context for the server.
  ##
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      ## NET_BIND_SERVICE is what lets the server bind config.listenAddress (:80 by default).
      ## Docker grants it implicitly, Kubernetes does not: with capabilities dropped and nothing
      ## added, the process fails with "listen tcp :80: bind: permission denied", even as root.
      ## Drop this if you move listenAddress and ports.http above 1024.
      add:
        - NET_BIND_SERVICE

  ## @param server.resources Resource requests and limits for the server.
  ##
  resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 256Mi
  # limits:
  #   memory: 1Gi

  ## @param server.livenessProbe Liveness probe for the server, hitting /health on the health port.
  ## @param server.readinessProbe Readiness probe for the server.
  ##
  livenessProbe:
    httpGet:
      path: /health
      port: health
    initialDelaySeconds: 30
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /health
      port: health
    initialDelaySeconds: 10
    periodSeconds: 10

  ## @param server.nodeSelector Node selector for the server pod.
  ## @param server.tolerations Tolerations for the server pod.
  ## @param server.affinity Affinity rules for the server pod.
  ##
  nodeSelector: {}
  tolerations: []
  affinity: {}

  ## @param server.volumes Extra volumes for the server pod.
  ## @param server.volumeMounts Extra volume mounts for the server container.
  ##
  volumes: []
  volumeMounts: []

## @section Dashboard
##
dashboard:
  ## @param dashboard.enabled Deploy the dashboard.
  ##
  enabled: true

  image:
    ## @param dashboard.image.repository Dashboard image repository.
    ##
    repository: netbirdio/dashboard
    ## @param dashboard.image.tag Dashboard image tag.
    ##
    tag: v2.90.7
    ## @param dashboard.image.pullPolicy Dashboard image pull policy.
    ##
    pullPolicy: IfNotPresent

  ## @param dashboard.imagePullSecrets Image pull secrets for the dashboard image.
  ##
  imagePullSecrets: []

  ## @param dashboard.replicaCount Dashboard replicas.
  ##
  replicaCount: 1

  ## @param dashboard.env Dashboard environment, merged over the chart's defaults. Those defaults
  ## point the dashboard at https://{domain} and the embedded IdP at https://{domain}/oauth2.
  ## Override AUTH_AUTHORITY, AUTH_CLIENT_ID, AUTH_AUDIENCE and AUTH_SUPPORTED_SCOPES when you use
  ## an external identity provider.
  ##
  env: {}

  ## @param dashboard.envRaw Extra dashboard environment variables in raw Kubernetes form.
  ##
  envRaw: []

  service:
    ## @param dashboard.service.type Service type for the dashboard.
    ##
    type: ClusterIP
    ## @param dashboard.service.port Port of the dashboard service.
    ##
    port: 80
    ## @param dashboard.service.annotations Annotations for the dashboard service.
    ##
    annotations: {}

  serviceAccount:
    ## @param dashboard.serviceAccount.create Create a ServiceAccount for the dashboard.
    ##
    create: true
    ## @param dashboard.serviceAccount.name Name of the ServiceAccount to create or use.
    ##
    name: ""
    ## @param dashboard.serviceAccount.annotations Annotations for the ServiceAccount.
    ##
    annotations: {}

  ## @param dashboard.podAnnotations Annotations for the dashboard pod.
  ## @param dashboard.podLabels Extra labels for the dashboard pod.
  ## @param dashboard.podSecurityContext Pod security context for the dashboard.
  ## @param dashboard.securityContext Container security context for the dashboard.
  ##
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}

  ## @param dashboard.resources Resource requests and limits for the dashboard.
  ##
  resources: {}

  ## @param dashboard.livenessProbe Liveness probe for the dashboard.
  ## @param dashboard.readinessProbe Readiness probe for the dashboard.
  ##
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 15
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  ## @param dashboard.nodeSelector Node selector for the dashboard pod.
  ## @param dashboard.tolerations Tolerations for the dashboard pod.
  ## @param dashboard.affinity Affinity rules for the dashboard pod.
  ##
  nodeSelector: {}
  tolerations: []
  affinity: {}

## @section Ingress
## One Ingress covering every route NetBird needs. The path list is fixed by NetBird's own routing
## (https://docs.netbird.io/selfhosted/external-reverse-proxy): the three gRPC prefixes go to the
## h2c Service, the API, IdP and websocket prefixes to the plain Service, everything else to the
## dashboard.
##
ingress:
  ## @param ingress.enabled Create the Ingress.
  ##
  enabled: false
  ## @param ingress.className IngressClass to use.
  ##
  className: ""
  ## @param ingress.host Host to serve on. Defaults to .Values.domain.
  ##
  host: ""
  ## @param ingress.annotations Annotations for the Ingress.
  ## e.g. for Traefik with an ACME resolver:
  ## annotations:
  ##   traefik.ingress.kubernetes.io/router.entrypoints: websecure
  ##   traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
  ##
  annotations: {}
  ## @param ingress.grpcAnnotations Annotations for a second Ingress carrying only the gRPC paths.
  ## Empty keeps every route on one Ingress, which is what Traefik wants: it takes the backend scheme
  ## from the h2c Service. Controllers that read the backend protocol off the Ingress instead, like
  ## ingress-nginx, need the gRPC routes split off, since that annotation would otherwise apply to
  ## the websocket routes as well and break them. Put only the protocol annotation here and leave
  ## certificate-issuing annotations in ingress.annotations; the split Ingress does not inherit them.
  ## e.g:
  ## grpcAnnotations:
  ##   nginx.ingress.kubernetes.io/backend-protocol: GRPC
  ##
  grpcAnnotations: {}
  ## @param ingress.pathType pathType for the generated paths.
  ##
  pathType: Prefix
  tls:
    ## @param ingress.tls.enabled Add a tls block for the host.
    ##
    enabled: true
    ## @param ingress.tls.secretName Certificate Secret. Leave empty when the controller obtains the
    ## certificate itself, e.g. through a Traefik certResolver.
    ##
    secretName: ""
  ## @param ingress.extraPaths Extra paths, inserted before the dashboard catch-all.
  ##
  extraPaths: []

## @section Metrics
##
metrics:
  serviceMonitor:
    ## @param metrics.serviceMonitor.enabled Create a Prometheus Operator ServiceMonitor scraping the
    ## server's /metrics endpoint.
    ##
    enabled: false
    ## @param metrics.serviceMonitor.namespace Namespace to create the ServiceMonitor in.
    ## @param metrics.serviceMonitor.labels Extra labels for the ServiceMonitor.
    ## @param metrics.serviceMonitor.annotations Extra annotations for the ServiceMonitor.
    ## @param metrics.serviceMonitor.interval Scrape interval.
    ## @param metrics.serviceMonitor.scrapeTimeout Scrape timeout.
    ## @param metrics.serviceMonitor.metricRelabelings Metric relabelings.
    ## @param metrics.serviceMonitor.relabelings Relabelings.
    ##
    namespace: ""
    labels: {}
    annotations: {}
    interval: ""
    scrapeTimeout: ""
    metricRelabelings: []
    relabelings: []

## @section Extra manifests
##
## @param extraManifests Arbitrary objects created alongside the chart.
##
extraManifests: []
