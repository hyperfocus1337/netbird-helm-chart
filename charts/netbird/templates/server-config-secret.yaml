{{- if and .Values.server.config.create (not .Values.server.config.existingSecret) }}
{{- /*
A Secret rather than a ConfigMap: config.yaml carries the relay auth secret, the store encryption
key and any database DSN. The server parses the file as plain YAML with no environment
substitution, so they cannot be moved out into env vars.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netbird.fullname" . }}-server-config
  namespace: {{ include "netbird.namespace" . }}
  labels:
    {{- include "netbird.server.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "netbird.server.config" . | nindent 4 }}
{{- end }}
