{{- if .Values.server.serviceH2c.enabled }}
{{- /* Same pods as the plain Service, but the ingress controller talks HTTP/2 cleartext to it. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netbird.fullname" . }}-server-h2c
  namespace: {{ include "netbird.namespace" . }}
  labels:
    {{- include "netbird.server.labels" . | nindent 4 }}
  {{- with .Values.server.serviceH2c.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "netbird.server.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
