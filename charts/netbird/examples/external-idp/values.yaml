# Optional external identity provider (Authentik, Keycloak, Zitadel, Okta, Entra, Google, ...)
# instead of the embedded IdP. See https://docs.netbird.io/selfhosted/identity-providers
#
# Two halves have to agree: the server validates tokens against the issuer, and the dashboard sends
# users to it. Only disable local auth once the external provider is proven, since doing so
# invalidates every local account.
domain: netbird.example.com

server:
  config:
    authSecret: "" # openssl rand -base64 32
    store:
      encryptionKey: "" # openssl rand -base64 32
    auth:
      issuer: https://idp.example.com/application/o/netbird/
      localAuthDisabled: true
      dashboardRedirectURIs:
        - https://netbird.example.com/nb-auth
        - https://netbird.example.com/nb-silent-auth
      cliRedirectURIs:
        - http://localhost:53000/

dashboard:
  env:
    # AUTH_AUTHORITY follows server.config.auth.issuer automatically; the rest is provider-specific.
    AUTH_CLIENT_ID: <client-id>
    AUTH_AUDIENCE: <client-id>
    AUTH_SUPPORTED_SCOPES: openid profile email offline_access api

ingress:
  enabled: true
  className: traefik
